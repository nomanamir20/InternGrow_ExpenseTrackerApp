name: interngrow_expense_tracker_app
description: "InternGrow Internship — Expense Tracker & Finance App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  get: ^4.6.6

  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_database: ^11.1.4

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  fl_chart: ^0.69.0

  pdf: ^3.11.1
  printing: ^5.13.3

  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/